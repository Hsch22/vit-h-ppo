name: CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-cpu-tests.txt
      - name: Install CPU regression dependencies
        run: |
          python -m pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-cpu-tests.txt
      - name: Check checkpoint manifest
        run: python scripts/checkpoints.py list
      - name: Run inference regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run tracker success tests
        run: PYTHONPATH=g1_tracker python -m unittest discover -s g1_tracker/tests -p 'test_*.py' -v
